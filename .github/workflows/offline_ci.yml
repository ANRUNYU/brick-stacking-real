name: Offline Python checks
on: [push, pull_request]
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python experiments/scripts/run_offline_validation.py
      - run: python -m brick_stacking.app.task_runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/test_runs/
