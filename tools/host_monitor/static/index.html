<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>垒砖监视台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <p class="brand-mark">垒砖监视台</p>
      <p class="brand-sub">HOST CAMERA · JOINT TELEMETRY · READ ONLY</p>
    </div>
    <div class="status-pill" id="link-pill">连接中…</div>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="stage-head">
        <h1>头部相机</h1>
        <p id="camera-meta">等待首帧</p>
      </div>
      <div class="viewport">
        <img id="head-stream" alt="头部相机实时画面" src="/stream/head" />
        <div class="scanline" aria-hidden="true"></div>
      </div>
    </section>

    <aside class="rail">
      <section class="panel">
        <h2>服务</h2>
        <dl id="service-meta" class="kv"></dl>
      </section>
      <section class="panel" id="arms-root">
        <h2>关节</h2>
        <p class="hint">J6/J7 若无只读角度，显示为 —（与现网 ArmStateReader 一致）</p>
        <div id="arms"></div>
      </section>
      <section class="panel warn">
        <h2>边界</h2>
        <ul>
          <li>只读监视，不发运动 / 使能 / Flash</li>
          <li>占用 Orbbec 时请停本服务再做视觉独占采集</li>
          <li>仅建议同局域网访问</li>
        </ul>
      </section>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
